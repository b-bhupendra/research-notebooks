<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="originGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="450" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">GitHub Directory Design &amp; CDN Edge Retrieval</text>
  <text x="450" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Zero-Rate-Limit Architectural Blueprint &amp; Multi-PoP Caching</text>

  <!-- Client Box -->
  <g filter="url(#cardShadow)">
    <rect x="50" y="140" width="200" height="230" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="150" y="175" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#38bdf8">Web Client App</text>
    <rect x="70" y="195" width="160" height="40" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="150" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#e2e8f0">Local SWR Memory</text>
    <rect x="70" y="245" width="160" height="40" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="150" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#e2e8f0">Shiki Code Render</text>
    <rect x="70" y="295" width="160" height="45" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="150" y="315" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#38bdf8">⚡ manifest.json</text>
    <text x="150" y="330" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">Single Request Index</text>
  </g>

  <!-- Flow 1: Fast CDN Edge Path -->
  <path d="M 250 200 L 350 200" stroke="#06b6d4" stroke-width="3" stroke-dasharray="6,4" fill="none"/>
  <polygon points="350,195 360,200 350,205" fill="#06b6d4"/>
  <text x="305" y="185" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#22d3ee">&lt; 25ms TTFB</text>

  <!-- Edge CDN Box -->
  <g filter="url(#cardShadow)">
    <rect x="360" y="120" width="220" height="150" rx="12" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
    <rect x="360" y="120" width="220" height="35" rx="12" fill="url(#edgeGrad)"/>
    <text x="470" y="143" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">Multi-CDN Edge Mesh</text>
    <text x="470" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f1f5f9">jsDelivr / Cloudflare PoPs</text>
    <text x="470" y="205" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">300+ Cities Worldwide</text>
    <text x="470" y="230" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#34d399">✓ Brotli Auto-Compression</text>
    <text x="470" y="250" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#34d399">✓ Zero Rate-Limiting</text>
  </g>

  <!-- Flow 2: CDN to Origin on Miss -->
  <path d="M 580 190 L 670 190" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <polygon points="670,186 680,190 670,194" fill="#64748b"/>
  <text x="630" y="175" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">Cache Miss</text>

  <!-- GitHub Origin Box -->
  <g filter="url(#cardShadow)">
    <rect x="680" y="140" width="180" height="230" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="770" y="175" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#f8fafc">GitHub Origin</text>
    <text x="770" y="195" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">research-notebooks</text>
    
    <rect x="695" y="215" width="150" height="30" rx="4" fill="#0f172a"/>
    <text x="770" y="235" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#cbd5e1">/manifest.json</text>

    <rect x="695" y="255" width="150" height="30" rx="4" fill="#0f172a"/>
    <text x="770" y="275" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#cbd5e1">/posts/*.md</text>

    <rect x="695" y="295" width="150" height="30" rx="4" fill="#0f172a"/>
    <text x="770" y="315" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#cbd5e1">/notebooks/*.ipynb</text>

    <rect x="695" y="335" width="150" height="25" rx="4" fill="#0f172a"/>
    <text x="770" y="352" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cbd5e1">/assets/*.svg</text>
  </g>

  <!-- Flow 3: Avoid Raw GitHub Directly -->
  <path d="M 250 310 Q 460 380 670 310" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <polygon points="670,305 680,310 672,315" fill="#f43f5e"/>
  <text x="470" y="385" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#f43f5e">⚠ Direct Raw GitHub (180-550ms TTFB · 60 req/hr Limit)</text>

  <!-- Footer Info -->
  <text x="450" y="445" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">Single-Request Manifest Pattern eliminates API crawling and optimizes edge delivery</text>
</svg>
